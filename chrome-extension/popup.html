<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慢慢买 Cookie 助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a2e;
      background: #f8f9fa;
    }
    h1 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    h1 .icon { font-size: 20px; }
    .status {
      padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px;
    }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #d1ecf1; color: #0c5460; }
    textarea {
      width: 100%; height: 80px; padding: 8px;
      border: 1px solid #ced4da; border-radius: 6px;
      font-family: "SF Mono", "Monaco", "Menlo", monospace;
      font-size: 12px; resize: vertical; word-break: break-all; background: #fff;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 16px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #4361ee; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .hint { margin-top: 10px; font-size: 12px; color: #6c757d; line-height: 1.5; }
  </style>
</head>
<body>
  <h1><span class="icon">🍪</span>慢慢买 Cookie 助手</h1>
  <div id="status"></div>
  <textarea id="cookieOutput" placeholder="点击获取按钮..." readonly></textarea>
  <div class="actions">
    <button id="btnFetch" class="btn btn-primary">🔄 获取 Cookie</button>
    <button id="btnCopy" class="btn btn-success" disabled>📋 复制</button>
  </div>
  <div class="hint">复制后粘贴到历史价格页面的 Cookie 输入框</div>
  <script src="popup.js"></script>
</body>
</html>
